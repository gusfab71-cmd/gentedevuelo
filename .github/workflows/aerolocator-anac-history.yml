name: AeroLocator - fuente histórica ANAC 2021

on:
  push:
    paths:
      - scripts/sync_anac_2021_history.py
      - .github/workflows/aerolocator-anac-history.yml
  workflow_dispatch:
  schedule:
    - cron: "35 7 2 * *"

permissions:
  contents: write

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar parser HTML
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Consultar fuente histórica ANAC 2021
        run: python scripts/sync_anac_2021_history.py
      - name: Conservar snapshot histórico si cambió
        shell: bash
        run: |
          git config user.name "Gente de Vuelo Catalog Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/aerolocator-anac-historical-2021.json
          if ! git diff --cached --quiet; then
            git commit -m "Datos: actualizar consulta histórica ANAC 2021"
            git push
          fi
