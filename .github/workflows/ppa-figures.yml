name: Integrar figuras PPA ANAC
on:
  push:
    branches: [main]
    paths:
      - "scripts/export_ppa_figures.py"
      - ".github/workflows/ppa-figures.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: python -m pip install --quiet pymupdf Pillow
      - name: Extraer figuras verificando PDF oficial
        run: python scripts/export_ppa_figures.py
      - name: Publicar imágenes locales en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulador-ppa/figuras/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "PPA: integrar recortes originales ANAC para preguntas con figuras"
            git push origin HEAD:main
          fi
