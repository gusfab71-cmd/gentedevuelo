name: Diagnóstico CHORDS Cañuelas (temporal)
on:
  pull_request:
    paths:
      - '.github/workflows/aerometeo-chords-diagnostics.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verificar estructura sin exponer mediciones
        shell: bash
        run: |
          node <<'JS'
          const u='https://3d-argentina.icdp.ucar.edu/api/v1/data/13.geojson?last';
          const keylist=v=>v&&typeof v==='object'?Object.keys(v).slice(0,24):[];
          try{
            const r=await fetch(u,{headers:{Accept:'application/geo+json, application/json'},signal:AbortSignal.timeout(13000)});
            console.log('HTTP_STATUS:',r.status,'CONTENT_TYPE:',r.headers.get('content-type'),'REDIRECTED:',r.redirected);
            if(!r.ok)process.exit(0);
            const raw=await r.text();
            console.log('CONTENT_LENGTH:',raw.length);
            try{
              const d=JSON.parse(raw);
              console.log('TOP_LEVEL:',keylist(d));
              console.log('TYPE:',typeof d,'ARRAY:',Array.isArray(d));
              if(d&&Array.isArray(d.features)){console.log('FEATURES:',d.features.length);console.log('FIRST_FEATURE_KEYS:',keylist(d.features[0]));console.log('FIRST_PROPERTIES_KEYS:',keylist(d.features[0]?.properties))}
              if(d&&Array.isArray(d.measurements)){console.log('MEASUREMENTS:',d.measurements.length);console.log('FIRST_MEASUREMENT_KEYS:',keylist(d.measurements[0]))}
              if(Array.isArray(d)){console.log('ARRAY_ROWS:',d.length);console.log('FIRST_ROW_KEYS:',keylist(d[0]))}
            }catch(e){console.log('NOT_JSON:',e.constructor.name)}
          }catch(e){console.log('FETCH_ERROR:',e.constructor.name,String(e.message).slice(0,100))}
          JS
