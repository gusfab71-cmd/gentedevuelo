name: AeroMeteo - mapa ampliado y evolución horaria
on:
  pull_request:
    paths:
      - 'assets/aerometeo*'
      - 'utilidades/aerometeo.html'
      - 'tests/aerometeo-map-hourly.test.cjs'
      - 'tests/aerometeo-automatic-metar-taf.test.cjs'
      - 'tests/aerometeo-radar.test.cjs'
      - 'tests/aerometeo-report-interpretation.test.cjs'
      - 'assets/aerolocator-open-meteo-ui.js'
      - 'api/aerometeo-aviation-weather.js'
      - '.github/workflows/aerometeo-map-hourly.yml'
  push:
    branches: [main]
    paths:
      - 'assets/aerometeo*'
      - 'utilidades/aerometeo.html'
      - 'tests/aerometeo-map-hourly.test.cjs'
      - 'tests/aerometeo-automatic-metar-taf.test.cjs'
      - 'tests/aerometeo-radar.test.cjs'
      - 'tests/aerometeo-report-interpretation.test.cjs'
      - 'assets/aerolocator-open-meteo-ui.js'
      - 'api/aerometeo-aviation-weather.js'
      - '.github/workflows/aerometeo-map-hourly.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis de los módulos
        run: |
          node --check assets/aerometeo-app.js
          node --check assets/aerometeo-hourly-chart.js
          node --check assets/aerometeo-radar.js
          node --check assets/aerometeo-messages-es.js
          node --check assets/aerolocator-open-meteo-ui.js
      - name: Probar mapa, pronóstico horario y aeropuertos provinciales
        run: |
          node --test tests/aerometeo-map-hourly.test.cjs
          node --test tests/aerometeo-airports-provinces.test.cjs
          node --test tests/aerometeo-automatic-metar-taf.test.cjs
          node --test tests/aerometeo-radar.test.cjs
          node --test tests/aerometeo-report-interpretation.test.cjs
