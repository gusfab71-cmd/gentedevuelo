name: Pruebas de mantenimiento aeronáutico

on:
  pull_request:
    paths:
      - 'utilidades/mantenimiento-aeronaves.html'
      - 'utilidades/gestion-aeronautica/mantenimiento-institucional.html'
      - 'utilidades/gestion-aeronautica/flota-institucional.html'
      - 'utilidades/gestion-aeronautica/cierre-diario-director.html'
      - 'tests/aerosuite-maintenance-integration.test.cjs'
      - 'utilidades/gestion-aeronautica/operaciones-institucionales.html'
      - 'utilidades/gestion-aeronautica/portal.html'
      - 'utilidades/gestor-reservas/index.html'
      - 'assets/aerosuite-registration.js'
      - 'tests/aerosuite-registration.test.cjs'
      - 'assets/maintenance-consumables.js'
      - 'tests/aircraft-maintenance.test.cjs'
      - '.github/workflows/mantenimiento-tests.yml'
  push:
    branches: [main]
    paths:
      - 'utilidades/mantenimiento-aeronaves.html'
      - 'utilidades/gestion-aeronautica/mantenimiento-institucional.html'
      - 'utilidades/gestion-aeronautica/flota-institucional.html'
      - 'utilidades/gestion-aeronautica/cierre-diario-director.html'
      - 'tests/aerosuite-maintenance-integration.test.cjs'
      - 'utilidades/gestion-aeronautica/operaciones-institucionales.html'
      - 'utilidades/gestion-aeronautica/portal.html'
      - 'utilidades/gestor-reservas/index.html'
      - 'assets/aerosuite-registration.js'
      - 'tests/aerosuite-registration.test.cjs'
      - 'assets/maintenance-consumables.js'
      - 'tests/aircraft-maintenance.test.cjs'
      - '.github/workflows/mantenimiento-tests.yml'

permissions:
  contents: read

jobs:
  maintenance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar mantenimiento de aeronaves
        run: node tests/aircraft-maintenance.test.cjs

      - name: Verificar integración del mantenimiento institucional
        run: node tests/aerosuite-maintenance-integration.test.cjs

      - name: Verificar formato automático de matrículas en AeroSuite
        run: node tests/aerosuite-registration.test.cjs
