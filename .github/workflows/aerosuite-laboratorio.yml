name: AeroSuite - Auditoria semanal automatica
on:
  schedule:
    - cron: '0 12 * * 1' # lunes 09:00 Argentina, UTC-3
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/aerosuite-laboratorio.test.mjs'
      - 'tests/gestion-aeronautica.test.mjs'
      - 'tests/aerosuite-*.test.*'
      - 'tests/aircraft-maintenance.test.cjs'
      - 'utilidades/gestion-aeronautica/**'
      - 'assets/aerosuite-registration.js'
      - 'scripts/aerosuite-weekly-audit.mjs'
      - 'docs/laboratorio-aerosuite.md'
      - '.github/workflows/aerosuite-laboratorio.yml'
permissions:
  contents: read
jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      TZ: America/Argentina/Buenos_Aires
      AUDITORIA_MODE: ficticio
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar y documentar auditoria
        run: node scripts/aerosuite-weekly-audit.mjs
      - name: Adjuntar reporte incluso si falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aerosuite-auditoria-semanal
          path: aerosuite-auditoria-resultados/
          if-no-files-found: warn
          retention-days: 30
