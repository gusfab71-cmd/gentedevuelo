name: AeroSuite - Auditoria semanal automatica
on:
  schedule:
    - cron: '0 12 * * 1' # lunes 09:00 ART
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/aerosuite-*.test.*'
      - 'tests/gestion-aeronautica.test.mjs'
      - 'tests/aircraft-maintenance.test.cjs'
      - 'utilidades/gestion-aeronautica/**'
      - 'assets/aerosuite-registration.js'
      - 'scripts/aerosuite-weekly-audit.mjs'
      - 'docs/laboratorio-aerosuite.md'
      - '.github/workflows/aerosuite-laboratorio.yml'
permissions:
  contents: read
concurrency:
  group: aerosuite-weekly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  modulos:
    name: 'Módulo: ${{ matrix.title }}'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: 'Turnera y formación'
            command: 'node --experimental-default-type=module tests/gestion-aeronautica.test.mjs'
          - title: 'Escenarios ficticios'
            command: 'node --experimental-default-type=module --test tests/aerosuite-laboratorio.test.mjs'
          - title: 'Mantenimiento institucional'
            command: 'node tests/aerosuite-maintenance-integration.test.cjs'
          - title: 'Matrículas y registros'
            command: 'node tests/aerosuite-registration.test.cjs'
          - title: 'Contratos de acceso por rol'
            command: 'node --test tests/aerosuite-role-portal-contract.test.cjs'
          - title: 'Dirección y permisos'
            command: 'node tests/aerosuite-director-institucional.test.mjs'
          - title: 'Aislamiento de demos'
            command: 'node tests/aerosuite-camino-demo.test.mjs'
          - title: 'Mantenimiento aeronáutico'
            command: 'node tests/aircraft-maintenance.test.cjs'
          - title: 'Monitor y permisos de auditoría'
            command: 'node --experimental-default-type=module --test tests/aerosuite-audit-monitor.test.mjs && node --experimental-default-type=module --test tests/aerosuite-lab-public.test.mjs'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar control aislado de la plataforma
        run: ${{ matrix.command }}
  laboratorio_sql:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    name: 'Módulo: Laboratorio SQL ficticio'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar lectura del laboratorio gratuito
        run: node --experimental-default-type=module --test tests/aerosuite-lab-public.test.mjs
      - name: Consultar controles SQL en modo solo lectura
        run: node --experimental-default-type=module scripts/aerosuite-lab-readonly-check.mjs
  resumen:
    name: Informe consolidado sin escrituras
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      TZ: America/Argentina/Buenos_Aires
      AUDITORIA_MODE: ficticio
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Consolidar pruebas, disponibilidad y cobertura pendiente
        run: node scripts/aerosuite-weekly-audit.mjs
      - name: Adjuntar evidencias aun si falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aerosuite-auditoria-semanal
          path: aerosuite-auditoria-resultados/
          if-no-files-found: warn
          retention-days: 30
