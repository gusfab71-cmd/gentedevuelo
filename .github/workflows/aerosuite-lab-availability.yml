name: AeroSuite - disponibilidad del laboratorio gratuito
on:
  schedule:
    - cron: '10 12 * * *' # Una consulta diaria 09:10 ART para reducir el riesgo de pausa Free
  workflow_dispatch:

permissions:
  contents: read

jobs:
  salud:
    name: Consulta de solo lectura sin secretos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module scripts/aerosuite-lab-readonly-check.mjs
