name: Gemini audit tests
on:
  push:
    branches:
      - feature/gemini-auditoria-preparacion
  pull_request:
    paths:
      - 'api/gemini-audit.js'
      - 'tests/gemini-audit.test.cjs'
      - '.github/workflows/gemini-audit-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check api/gemini-audit.js
          node --check tests/gemini-audit.test.cjs
      - name: Unit tests (no Gemini API call)
        run: node --test tests/gemini-audit.test.cjs
