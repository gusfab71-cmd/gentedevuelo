name: AeroLocator - enriquecer fichas con MADHEL oficial

on:
  push:
    paths:
      - scripts/sync_anac_madhel_official.py
      - .github/workflows/aerolocator-madhel-official.yml
  workflow_dispatch:
  schedule:
    - cron: "45 7 * * 1"

permissions:
  contents: write

jobs:
  madhel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sincronizar registros MADHEL desde ANAC, con control de errores
        run: python scripts/sync_anac_madhel_official.py
      - name: Publicar sólo una copia válida
        shell: bash
        run: |
          git config user.name "Gente de Vuelo Catalog Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/aerolocator-anac-madhel-official.json
          if ! git diff --cached --quiet; then
            git commit -m "Datos: sincronizar fichas MADHEL oficial ANAC"
            git push
          fi
