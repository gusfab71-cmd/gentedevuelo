name: AeroSuite - Respaldo cifrado manual (sin programación)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Escribir COPIA-CIFRADA-MANUAL sólo después de configurar secretos y almacenamiento separado'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: aerosuite-manual-backup
  cancel-in-progress: false
jobs:
  backup:
    if: ${{ inputs.confirmation == 'COPIA-CIFRADA-MANUAL' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Instalar herramientas de backup
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-common age awscli
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-client-17
      - name: Comprobar herramientas sin imprimir secretos
        run: |
          set -euo pipefail
          command -v pg_dump
          command -v pg_restore
          pg_dump --version | grep -E '17\.'
          command -v age
          command -v aws
      - name: Exportar y subir solo el respaldo cifrado
        env:
          AEROSUITE_BACKUP_CONFIRM: ${{ inputs.confirmation }}
          AEROSUITE_BACKUP_DB_URL: ${{ secrets.AEROSUITE_BACKUP_DB_URL }}
          AEROSUITE_BACKUP_AGE_RECIPIENT: ${{ secrets.AEROSUITE_BACKUP_AGE_RECIPIENT }}
          AEROSUITE_BACKUP_BUCKET: ${{ secrets.AEROSUITE_BACKUP_BUCKET }}
          AEROSUITE_BACKUP_S3_ENDPOINT: ${{ secrets.AEROSUITE_BACKUP_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AEROSUITE_BACKUP_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AEROSUITE_BACKUP_S3_SECRET_KEY }}
        run: bash scripts/aerosuite-backup-encrypted.sh
